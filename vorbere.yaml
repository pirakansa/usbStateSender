version: 1
vars:
  PROJECT_NAME: "usb-state-sender"

tasks:
  build:
    run: cargo build --locked
    desc: Build debug artifacts

  run:
    run: RUST_LOG=debug cargo run -- --help
    desc: Run the usbStateSender binary

  fmt:
    run: cargo fmt --all
    desc: Format Rust code

  fmt-check:
    run: cargo fmt --all -- --check
    desc: Check Rust formatting

  clippy:
    run: cargo clippy --all-targets -- -D warnings
    desc: Run clippy with warnings denied

  check:
    depends_on: [fmt-check, clippy]
    desc: Run all lint checks

  test:
    depends_on: [check, build]
    run: cargo test --all
    desc: Run test suite
# cargo install cargo-audit
  vulnerability:
    run: cargo audit
    desc: Scan dependencies for known vulnerabilities

  clean:
    run: cargo clean
    desc: Clean build artifacts

  linux-amd64:
    run: cargo build --locked --release --target x86_64-unknown-linux-gnu
    desc: Build release binary for Linux amd64

  linux-arm64:
    run: cargo build --locked --release --target aarch64-unknown-linux-gnu
    desc: Build release binary for Linux arm64

  release-build:
    depends_on: [linux-amd64, linux-arm64]
    desc: Build all release binaries

  release-archives:
    depends_on: [release-build]
    run: |
      tar --gzip --create --directory=target/x86_64-unknown-linux-gnu/release --file=./${{ .vars.PROJECT_NAME }}_linux-amd64.tar.gz ${{ .vars.PROJECT_NAME }}
      tar --gzip --create --directory=target/aarch64-unknown-linux-gnu/release --file=./${{ .vars.PROJECT_NAME }}_linux-arm64.tar.gz ${{ .vars.PROJECT_NAME }}
    desc: Archive release binaries

  release:
    depends_on: [release-archives]
    desc: Build and archive release artifacts

  ci:
    depends_on: [check, test, build]
    desc: Run CI-equivalent checks
