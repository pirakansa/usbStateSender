[package]
name = "usb-state-sender"
version = "0.1.0"
edition = "2021"
description = "CLI for sending USB state information"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pirakansa/usbStateSender"
readme = "README.md"

[dependencies]
thiserror = "2.0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
